<!doctype html>
<html lang="en-ZA">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>Election Campaign OS</title>
    <meta
      name="description"
      content="Field operations for South African municipal campaigns — canvassing, ward data, incidents and compliance, usable offline."
    />

    <!-- Installable shell. See public/manifest.webmanifest. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#1A2246" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icon-192.png" sizes="192x192" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="EC OS" />

    <!--
      This application holds voter records under POPIA. A referrer sent to
      any third party on navigation would leak the route — and routes here
      carry ward and voting-district codes.
    -->
    <meta name="referrer" content="same-origin" />
    <meta name="robots" content="noindex, nofollow" />

    <!--
      Typefaces are self-hosted (public/fonts, generated by
      tools/fonts/vendor-fonts.mjs) and imported through src/index.css, so
      there is no render-blocking CDN request and nothing to fail offline.
      Preloading the two faces above the fold keeps the first paint in the
      right typeface rather than swapping after it.
    -->
    <link
      rel="preload"
      href="/fonts/public-sans-400-normal-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/archivo-narrow-700-normal-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body class="bg-paper text-ink font-body">
    <div id="root"></div>
    <noscript>
      Election Campaign OS needs JavaScript. It is a field application that stores work on your device and
      sends it when you have signal, which cannot be done without it.
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
